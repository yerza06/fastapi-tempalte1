[project]
name = "learn2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yernaz Kengesbekov", email = "yernazkenesbekov24@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.1",
    "uvicorn>=0.54.0",
]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# NOTE: один event loop на всю сессию, иначе asyncpg-соединения engine ломаются между тестами
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
